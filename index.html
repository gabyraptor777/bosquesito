<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosquesito</title>
    <!-- A-Frame 1.5.0 - mucho más rápido que 1.0.4 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 1s ease;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }
        #loading-text {
            color: #7fc97f; font-family: monospace; font-size: 1.2rem;
            margin-bottom: 1rem; letter-spacing: 2px;
        }
        #loading-bar-outer {
            width: 260px; height: 8px; border: 1px solid #7fc97f;
            border-radius: 4px; overflow: hidden;
        }
        #loading-bar-inner {
            width: 0%; height: 100%; background: #7fc97f;
            transition: width 0.3s ease;
        }
        #loading-tip {
            color: #4a8a5a; font-family: monospace; font-size: 0.75rem;
            margin-top: 1rem; max-width: 240px; text-align: center;
        }
    </style>
</head>

<body>

<div id="loading-screen">
    <div id="loading-text">🌳 cargando bosquesito...</div>
    <div id="loading-bar-outer"><div id="loading-bar-inner"></div></div>
    <div id="loading-tip">movete con WASD · mirá con el mouse · en móvil: tocá y deslizá</div>
</div>

<a-scene

    renderer="antialias: false; physicallyCorrectLights: false; maxCanvasWidth: 1920; maxCanvasHeight: 1080"

    <a-assets timeout="30000">

    <!-- Cámara con controles WASD -->
    <a-entity id="rig" position="0 0 0">
        <a-camera

            look-controls="pointerLockEnabled: false"
            position="0 1.6 0"
            far="60">
        </a-camera>
    </a-entity>

    <!-- Cielo con GIF animado - usando canvas para compatibilidad sin plugins -->
    <a-sky id="cielo" src="#gif-canvas" repeat="2 2"></a-sky>



</a-scene>

<script>
    // GIF animado usando gifler
    document.querySelector('a-scene').addEventListener('loaded', function() {
        const skyEl = document.getElementById('cielo');
        const canvas = document.getElementById('gif-canvas');
        gifler('./assets/100.gif').animate(canvas);
        function updateTexture() {
            const mesh = skyEl.getObject3D('mesh');
            if (mesh && mesh.material && mesh.material.map) {
                mesh.material.map.needsUpdate = true;
            }
            requestAnimationFrame(updateTexture);
        }
        updateTexture();
    });
    (function() {
        const canvas = document.getElementById('gif-canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.src = './assets/100.gif';

        let skyEl = null;
        let animating = false;

        function animateGif() {
            if (!animating) return;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            // Forzar que A-Frame actualice la textura
            if (skyEl) {
                const mat = skyEl.getObject3D('mesh');
                if (mat && mat.material && mat.material.map) {
                    mat.material.map.needsUpdate = true;
                }
            }
            requestAnimationFrame(animateGif);
        }

        img.onload = function() {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };

        img.onerror = function() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        };

        document.querySelector('a-scene').addEventListener('loaded', function() {
            skyEl = document.getElementById('cielo');
            animating = true;
            animateGif();
        });
    })();


    const loadingScreen = document.getElementById('loading-screen');
    const bar = document.getElementById('loading-bar-inner');
    const loadingText = document.getElementById('loading-text');

    const scene = document.querySelector('a-scene');
    const assets = document.querySelector('a-assets');

    let totalAssets = document.querySelectorAll('a-asset-item').length;
    let loadedAssets = 0;

    function updateBar() {
        loadedAssets++;
        const pct = Math.min(100, Math.round((loadedAssets / totalAssets) * 100));
        bar.style.width = pct + '%';
        loadingText.textContent = '🌳 cargando bosquesito... ' + pct + '%';
    }

    document.querySelectorAll('a-asset-item').forEach(item => {
        item.addEventListener('loaded', updateBar);
        item.addEventListener('error', updateBar); // contamos errores también para no quedarnos colgados
    });

    scene.addEventListener('loaded', () => {
        bar.style.width = '100%';
        loadingText.textContent = '🌳 ¡bosquesito listo!';
        setTimeout(() => {
            loadingScreen.classList.add('fade-out');
            setTimeout(() => loadingScreen.remove(), 1000);
        }, 400);

        // Música: esperar interacción del usuario (política de browsers modernos)
        const audio = document.getElementById('musica');
        const startAudio = () => {
            audio.play().catch(() => {});
            document.removeEventListener('click', startAudio);
            document.removeEventListener('keydown', startAudio);
        };
        document.addEventListener('click', startAudio);
        document.addEventListener('keydown', startAudio);
    });

    // Fallback: si tarda más de 20s, entrar igual
    setTimeout(() => {
        if (loadingScreen.parentNode) {
            loadingScreen.classList.add('fade-out');
            setTimeout(() => loadingScreen.remove(), 1000);
        }
    }, 20000);
</script>

</body>
</html>
